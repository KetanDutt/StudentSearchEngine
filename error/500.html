<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 - Server Error | FindinG</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
  <div class="text-center card-modern p-5">
    <div style="font-size:5rem;">⚠️</div>
    <h1 class="display-1 fw-bold">500</h1>
    <h3>Internal Server Error</h3>
    <p class="text-muted">Something went wrong on our side. Please try again later.</p>
    <p class="small text-muted">If problem persists, contact support with timestamp: <span id="ts"></span></p>
    <div class="mt-4">
      <a href="/index.html" class="btn btn-primary">Go Home</a>
      <button onclick="location.reload()" class="btn btn-outline-secondary">Retry</button>
    </div>
  </div>
</div>
<script>document.getElementById('ts').textContent = new Date().toISOString();</script>
</body>
</html>
