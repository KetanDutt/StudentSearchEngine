<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindinG - Company Registration</title>
  <link rel="icon" href="images/logo.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="index.html">FindinG</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="hr.html">Dashboard</a>
        <a class="nav-link" href="logout.jsp">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="text-center mb-4">
      <h1 class="display-6 fw-bold text-white">Company Registration</h1>
      <p class="text-white-50">Showcase your company to attract top student talent</p>
    </div>

    <form name="myForm" onsubmit="return validateCompany()" action="hrreg.jsp" method="post">
      <div class="jumbotron2 card-modern">
        <div id="alertContainer"></div>

        <div class="mb-4">
          <h5 class="section-title">🏢 Company Details</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Username *</label>
              <input type="text" class="form-control" name="user" placeholder="Login username" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Company Name *</label>
              <input type="text" class="form-control" name="cid" placeholder="e.g. Google" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Authorization / CIN</label>
              <input type="text" class="form-control" name="auth" placeholder="Company auth code">
            </div>
            <div class="col-md-3">
              <label class="form-label">Established Year *</label>
              <input type="number" class="form-control" name="yr" placeholder="1998" min="1800" max="2026" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Total Employees *</label>
              <input type="text" class="form-control" name="emp" placeholder="10000" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Highest Salary *</label>
              <input type="text" class="form-control" name="hsal" placeholder="50 LPA" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Branches in India</label>
              <input type="text" class="form-control" name="brch" placeholder="10">
            </div>
            <div class="col-12">
              <label class="form-label">Head Office Address *</label>
              <input type="text" class="form-control" name="addr" placeholder="Full address" required>
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="mb-4">
          <h5 class="section-title">📦 Product Portfolio</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Major Product</h6>
                <input type="text" class="form-control mb-2" name="t1" placeholder="Product Objective">
                <input type="text" class="form-control mb-2" name="c1" placeholder="Client Company">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="y1" placeholder="Created Year"></div>
                  <div class="col-6"><input type="text" class="form-control" name="a1" placeholder="Value"></div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Minor Product</h6>
                <input type="text" class="form-control mb-2" name="t2" placeholder="Product Objective">
                <input type="text" class="form-control mb-2" name="c2" placeholder="Client Company">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="y2" placeholder="Created Year"></div>
                  <div class="col-6"><input type="text" class="form-control" name="a2" placeholder="Value"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="mb-4">
          <h5 class="section-title">💼 Job Openings</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Major Vacancy</h6>
                <input type="text" class="form-control mb-2" name="jid" placeholder="Job Post e.g. SDE">
                <input type="text" class="form-control mb-2" name="jt" placeholder="Job Type e.g. Full Time">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="ja" placeholder="Location State"></div>
                  <div class="col-6"><input type="text" class="form-control" name="js" placeholder="Salary"></div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Minor Vacancy</h6>
                <input type="text" class="form-control mb-2" name="jid2" placeholder="Job Post e.g. Intern">
                <input type="text" class="form-control mb-2" name="jt2" placeholder="Job Type e.g. Internship">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="ja2" placeholder="Location State"></div>
                  <div class="col-6"><input type="text" class="form-control" name="js2" placeholder="Salary"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary btn-lg px-5">Register Company & Continue →</button>
          <div class="form-text mt-2">Your company will be visible to students after verification</div>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
