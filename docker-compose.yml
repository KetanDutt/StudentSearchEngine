version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: finding_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-toor}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project}
      MYSQL_USER: ${MYSQL_USER:-finding_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finding_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: tomcat:9-jdk11
    container_name: finding_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-finding_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-finding_pass_2026}
    volumes:
      - ./target/finding.war:/usr/local/tomcat/webapps/ROOT.war
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
