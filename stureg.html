<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindinG - Student Registration</title>
  <link rel="icon" href="images/logo.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="index.html">FindinG</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="stu.html">Dashboard</a>
        <a class="nav-link" href="logout.jsp">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="text-center mb-4">
      <h1 class="display-6 fw-bold text-white">Student Registration</h1>
      <p class="text-white-50">Complete your profile to get discovered by top companies</p>
    </div>

    <form name="myForm" onsubmit="return validateStudent()" action="stureg.jsp" method="post">
      <div class="jumbotron2 card-modern">
        <div id="alertContainer"></div>

        <div class="mb-4">
          <h5 class="section-title">👤 Personal Details</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Username *</label>
              <input type="text" class="form-control" name="user" placeholder="Your login username" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Age *</label>
              <input type="number" class="form-control" name="age" placeholder="22" min="16" max="60" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Mobile *</label>
              <input type="tel" class="form-control" name="mnum" placeholder="10-digit number" pattern="[0-9]{10}" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" name="addr" placeholder="City, State">
            </div>
            <div class="col-md-6">
              <label class="form-label">Father's Name</label>
              <input type="text" class="form-control" name="fname" placeholder="Father's full name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Mother's Name</label>
              <input type="text" class="form-control" name="mname" placeholder="Mother's full name">
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="mb-4">
          <h5 class="section-title">🎓 Educational Details</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">College Name *</label>
              <input type="text" class="form-control" name="cid" placeholder="e.g. PIET" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">University *</label>
              <input type="text" class="form-control" name="uid" placeholder="e.g. MDU" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Branch *</label>
              <input type="text" class="form-control" name="brch" placeholder="CSE" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Semester *</label>
              <input type="number" class="form-control" name="sem" placeholder="6" min="1" max="8" required>
            </div>

            <div class="col-md-3">
              <label class="form-label">10th Board</label>
              <input type="text" class="form-control" name="10thb" placeholder="CBSE">
            </div>
            <div class="col-md-3">
              <label class="form-label">10th %</label>
              <input type="text" class="form-control" name="10thp" placeholder="85%">
            </div>
            <div class="col-md-3">
              <label class="form-label">12th Board</label>
              <input type="text" class="form-control" name="12thb" placeholder="CBSE">
            </div>
            <div class="col-md-3">
              <label class="form-label">12th %</label>
              <input type="text" class="form-control" name="12thp" placeholder="80%">
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="mb-4">
          <h5 class="section-title">💻 Technical Skills</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Major Technology</h6>
                <input type="text" class="form-control mb-2" name="t1" placeholder="Technology e.g. Java">
                <input type="text" class="form-control mb-2" name="c1" placeholder="Company e.g. Infosys">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="ds1" placeholder="Start Date"></div>
                  <div class="col-6"><input type="text" class="form-control" name="de1" placeholder="End Date"></div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card bg-light border-0 p-3">
                <h6 class="fw-bold">Minor Technology</h6>
                <input type="text" class="form-control mb-2" name="t2" placeholder="Technology e.g. Python">
                <input type="text" class="form-control mb-2" name="c2" placeholder="Company e.g. TCS">
                <div class="row g-2">
                  <div class="col-6"><input type="text" class="form-control" name="ds2" placeholder="Start Date"></div>
                  <div class="col-6"><input type="text" class="form-control" name="de2" placeholder="End Date"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="mb-4">
          <h5 class="section-title">💼 Job Preference</h5>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Desired Role *</label>
              <input type="text" class="form-control" name="jid" placeholder="Software Engineer" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" name="ja" placeholder="Bangalore">
            </div>
            <div class="col-md-3">
              <label class="form-label">Company Type</label>
              <input type="text" class="form-control" name="jt" placeholder="Product Based">
            </div>
            <div class="col-md-3">
              <label class="form-label">Expected Salary</label>
              <input type="text" class="form-control" name="js" placeholder="6 LPA">
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary btn-lg px-5">Save Profile & Continue →</button>
          <div class="form-text mt-2">Your profile will be visible to recruiters after completion</div>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
